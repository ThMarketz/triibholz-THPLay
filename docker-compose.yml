services:
  triibholz:
    build: .
    image: triibholz-thplay:latest
    container_name: triibholz
    ports:
      - "8088:80"        # open http://localhost:8088
    restart: unless-stopped

  analysis:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: triibholz-analysis:latest
    container_name: triibholz-analysis
    ports:
      - "4200:4200"      # analysis API — set as the cloud endpoint: http://localhost:4200
    volumes:
      - analysis-data:/data
    restart: unless-stopped

volumes:
  analysis-data:

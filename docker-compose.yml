services:
  triibholz:
    build: .
    image: triibholz-thplay:latest
    container_name: triibholz
    ports:
      - "8088:80"        # open http://localhost:8088 — the API is at /api on the same address
    depends_on:
      - analysis
    restart: unless-stopped

  analysis:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: triibholz-analysis:latest
    container_name: triibholz-analysis
    ports:
      - "127.0.0.1:4200:4200"   # this Mac only (curl, debugging); everyone else goes through /api on :8088
    volumes:
      - analysis-data:/data
    restart: unless-stopped

volumes:
  analysis-data:

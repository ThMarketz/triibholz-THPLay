# Anything that is not the canonical host is sent to it, permanently, before the app is served.
#
# Without this, `server_name _` hands the whole app to any hostname that resolves here — and the
# app then works right up to the first action, because the server's Origin check knows only the
# canonical origin: an invite code entered on www.thplay.ch is refused as "bad-origin" with the app
# looking perfectly healthy around it. Worse, a second hostname is a second browser origin, so it
# gets its own storage and its own passkeys: a coach who signs in there builds a parallel account
# with a parallel roster.
#
# CANONICAL_HOST is written at start (deploy/nginx-canonical-host.inc); with it unset the map is
# empty and nothing is redirected, so local development at localhost:8088 is untouched.
include /etc/nginx/triibholz-canonical.inc;

server {
    listen       80;
    server_name  _;

    # $canonical_redirect is empty unless the Host is set and is not the canonical one
    if ($canonical_redirect) { return 301 $canonical_redirect; }

    root   /usr/share/nginx/html;
    index  index.html;

    # behind a tunnel: the visitor's address from CF-Connecting-IP, trusted only from TRUSTED_PROXY
    # (written at start by deploy/nginx-real-ip.sh; empty when unset)
    include /etc/nginx/triibholz-real-ip.inc;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;

    # never cache the HTML shell or the service worker so updates show immediately
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js      { add_header Cache-Control "no-cache"; }

    # correct MIME for the web app manifest (per-file, doesn't touch the global map)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=604800";
    }

    # the club server (analysis container) on the app's own origin: /api/... is proxied, never
    # cached, and streamed both ways so multi-GB match videos never sit in nginx's buffers.
    # ^~ so the static-asset regex below cannot claim /api/clips/x.mp4 or a future /api/x.js.
    # The upstream is a variable, resolved through Docker's DNS per request, so nginx still starts
    # (and serves the offline-capable app) when the analysis container is down.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $club_api http://analysis:4200;
        proxy_pass $club_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # set, never passed through: a client-supplied X-Forwarded-For must not reach the server
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 4g;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # A path that NAMES A FILE must resolve to that file or 404. It must never fall through to
    # the shell below, and `try_files $uri =404` is what says so rather than leaving it implied by
    # location-matching order — which only covered the extensions that happened to be listed here.
    #
    # Measured before this was added: /icons/typo.png answered 404 (this regex claimed it), but
    # /data/typo.json and /favicon.ico answered 200 text/html, because neither extension was in
    # the list and `location /` took them. data/rules.json is PRECACHED by the service worker, so
    # a rule book that moved or was misspelt would not fail: cache.addAll() would succeed, the
    # shell would be stored under a .json URL, and the app would carry an HTML page as its rule
    # book until the cache was thrown away.
    #
    # cache JS/CSS/icons/fonts for a week (small; the SW also caches them)
    location ~* \.(js|css|svg|png|ico|webmanifest|woff2?|ttf|map)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Data and media: must resolve or 404, but deliberately NOT given a week in the browser cache.
    # data/rules.json is refreshed by scripts/update-rules.mjs when Swiss Aquatics publishes, and a
    # week-long max-age would hold a superseded rule book in front of coaches.
    location ~* \.(json|mp4|webm|txt|pdf|docx)$ {
        try_files $uri =404;
    }

    # The legal documents. Must resolve or 404 like any file, served as UTF-8 text so accents and
    # guillemets survive, and never given a long browser cache: a changed document must be the one
    # a reader sees, since accepting it records its version.
    location ~* ^/legal/.+\.md$ {
        types { }
        default_type "text/markdown; charset=utf-8";
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # single-page style fallback to the shell
    location / {
        try_files $uri $uri/ /index.html;
    }
}

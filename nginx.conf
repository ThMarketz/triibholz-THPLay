# Anything that is not the canonical host is sent to it, permanently, before the app is served.
#
# Without this, `server_name _` hands the whole app to any hostname that resolves here — and the
# app then works right up to the first action, because the server's Origin check knows only the
# canonical origin: an invite code entered on www.thplay.ch is refused as "bad-origin" with the app
# looking perfectly healthy around it. Worse, a second hostname is a second browser origin, so it
# gets its own storage and its own passkeys: a coach who signs in there builds a parallel account
# with a parallel roster.
#
# CANONICAL_HOST is written at start (deploy/nginx-canonical-host.inc); with it unset the map is
# empty and nothing is redirected, so local development at localhost:8088 is untouched.
include /etc/nginx/triibholz-canonical.inc;

server {
    listen       80;
    server_name  _;

    # $canonical_redirect is empty unless the Host is set and is not the canonical one
    if ($canonical_redirect) { return 301 $canonical_redirect; }

    root   /usr/share/nginx/html;
    index  index.html;

    # behind a tunnel: the visitor's address from CF-Connecting-IP, trusted only from TRUSTED_PROXY
    # (written at start by deploy/nginx-real-ip.sh; empty when unset)
    include /etc/nginx/triibholz-real-ip.inc;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;

    # never cache the HTML shell or the service worker so updates show immediately
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js      { add_header Cache-Control "no-cache"; }

    # correct MIME for the web app manifest (per-file, doesn't touch the global map)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=604800";
    }

    # the club server (analysis container) on the app's own origin: /api/... is proxied, never
    # cached, and streamed both ways so multi-GB match videos never sit in nginx's buffers.
    # ^~ so the static-asset regex below cannot claim /api/clips/x.mp4 or a future /api/x.js.
    # The upstream is a variable, resolved through Docker's DNS per request, so nginx still starts
    # (and serves the offline-capable app) when the analysis container is down.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $club_api http://analysis:4200;
        proxy_pass $club_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # set, never passed through: a client-supplied X-Forwarded-For must not reach the server
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 4g;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # cache JS/CSS/icons for a week (small; the SW also caches them)
    location ~* \.(js|css|svg|png|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # single-page style fallback to the shell
    location / {
        try_files $uri $uri/ /index.html;
    }
}
